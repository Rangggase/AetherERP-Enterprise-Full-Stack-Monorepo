<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AetherERP: pengadaan, gudang, penjualan, dan akuntansi dalam satu sistem." />
    <meta name="theme-color" content="#F4F1EA" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AetherERP</title>
    <!-- Font di-host sendiri (public/fonts). Dua berkas terpenting dimuat lebih dulu. -->
    <link rel="preload" href="/fonts/ibm-plex-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/source-serif-4-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Preferensi tampilan diterapkan sebelum render pertama agar tidak berkedip (src/lib/preferences.ts). -->
    <script>
      (function () {
        var d = document.documentElement, p = {};
        try { p = JSON.parse(localStorage.getItem("aether.prefs") || "{}") || {}; } catch (e) {}
        var m = p.motion;
        if (m !== "full" && m !== "reduced" && m !== "minimal") m = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches ? "reduced" : "full";
        d.setAttribute("data-motion", m);
        d.setAttribute("data-texture", p.texture === false ? "off" : "on");
        d.setAttribute("data-density", p.density === "compact" ? "compact" : "comfortable");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
